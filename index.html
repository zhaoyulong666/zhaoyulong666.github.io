<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>导航页</title>
<style>
  :root{
    --r:14px;
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  html[data-theme="dark"]{
    --bg:#0b0f14; --panel:#131a24; --panel-hover:#19222f;
    --line:#1f2a38; --text:#e6edf5; --muted:#7d8a9c;
    --accent:#4f9cf9; --accent-soft:rgba(79,156,249,.14);
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --input:#0e141d;
  }
  html[data-theme="light"]{
    --bg:#f2f5f9; --panel:#ffffff; --panel-hover:#ffffff;
    --line:#e2e8f0; --text:#16202e; --muted:#71809a;
    --accent:#2f7de1; --accent-soft:rgba(47,125,225,.1);
    --shadow:0 10px 30px rgba(20,40,80,.12);
    --input:#f7f9fc;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.5;
    transition:background .25s var(--ease), color .25s var(--ease);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none}

  .app{max-width:1180px; margin:0 auto; padding:26px 22px 70px;}

  /* ============ 顶栏 ============ */
  .header{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:26px;}
  .brand{display:flex; align-items:center; gap:12px; min-width:0}
  .logo{
    width:42px;height:42px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),#7b5cff);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:18px;
    box-shadow:0 6px 18px var(--accent-soft);
  }
  .brand .title{font-size:15px;font-weight:700;letter-spacing:.3px}
  .brand .time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  .header-actions{display:flex; gap:9px; flex:0 0 auto; align-items:center}
  .icon-btn{
    height:38px; padding:0 14px; border-radius:10px;
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    font-size:13px; font-family:inherit; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    transition:all .18s var(--ease);
  }
  .icon-btn:hover{border-color:var(--accent); color:var(--accent)}

  /* ============ 天气 ============ */
  #weather{
    display:inline-flex; align-items:center; gap:6px;
    height:38px; padding:0 12px; border-radius:10px;
    background:var(--panel); border:1px solid var(--line);
    font-size:13px; color:var(--text); cursor:pointer;
    transition:all .18s var(--ease); white-space:nowrap;
    user-select:none;
  }
  #weather:hover{border-color:var(--accent)}
  #weather:active{transform:scale(.98)}
  #weather .w-emoji{font-size:16px; line-height:1}
  #weather .w-temp{font-weight:600; font-variant-numeric:tabular-nums}
  #weather .w-desc{color:var(--muted); font-size:12px}
  #weather .w-city{
    color:var(--muted); font-size:12px;
    padding-left:6px; margin-left:2px;
    border-left:1px solid var(--line);
    max-width:92px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #weather .w-loading{color:var(--muted); font-size:12px}

  /* ============ 搜索 ============ */
  .search-wrap{position:relative; max-width:640px; margin:0 auto 30px;}
  .search-box{
    display:flex; align-items:center; gap:6px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:7px 7px 7px 8px;
    transition:all .2s var(--ease);
    box-shadow:0 2px 10px rgba(0,0,0,.06);
  }
  .search-box:focus-within{
    border-color:var(--accent);
    box-shadow:0 0 0 4px var(--accent-soft), 0 6px 20px rgba(0,0,0,.12);
  }
  .engine-btn{
    flex:0 0 auto; height:38px; padding:0 12px; border-radius:10px;
    background:transparent; border:none; color:var(--muted);
    font-size:13px; font-family:inherit; cursor:pointer;
    display:inline-flex; align-items:center; gap:5px;
    transition:all .18s var(--ease); white-space:nowrap;
  }
  .engine-btn:hover{background:var(--accent-soft); color:var(--accent)}
  .engine-btn svg{opacity:.6}

  #searchInput{
    flex:1 1 auto; min-width:0; height:38px; border:none; outline:none;
    background:transparent; color:var(--text); font-size:15px; font-family:inherit;
  }
  #searchInput::placeholder{color:var(--muted)}
  .go-btn{
    flex:0 0 auto; height:38px; width:60px; border-radius:11px; border:none;
    background:var(--accent); color:#fff; font-size:14px; font-weight:600;
    font-family:inherit; cursor:pointer; transition:all .18s var(--ease);
  }
  .go-btn:hover{filter:brightness(1.1); transform:translateY(-1px)}

  .engine-menu{
    position:absolute; top:calc(100% + 8px); left:0; z-index:50;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:6px; min-width:150px; box-shadow:var(--shadow);
    display:none;
  }
  .engine-menu.show{display:block; animation:pop .16s var(--ease)}
  .engine-menu button{
    display:block; width:100%; text-align:left; padding:8px 11px;
    border:none; background:transparent; color:var(--text); font-size:13px;
    font-family:inherit; border-radius:8px; cursor:pointer;
    transition:background .15s;
  }
  .engine-menu button:hover{background:var(--accent-soft); color:var(--accent)}
  .engine-menu button.active{color:var(--accent); font-weight:600}

  /* ============ 搜索建议下拉 ============ */
  .suggest-box{
    position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:45;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:6px; margin:0; list-style:none; box-shadow:var(--shadow);
    display:none; max-height:320px; overflow-y:auto;
  }
  .suggest-box.show{display:block; animation:pop .16s var(--ease)}
  .suggest-box li{
    padding:9px 12px; border-radius:8px; cursor:pointer;
    font-size:14px; color:var(--text); transition:background .12s;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .suggest-box li:hover,
  .suggest-box li.active{background:var(--accent-soft); color:var(--accent)}
  .suggest-box li b{color:var(--accent); font-weight:600}

  @keyframes pop{from{opacity:0; transform:translateY(-6px)}to{opacity:1; transform:none}}

  /* ============ 分类 ============ */
  .cats{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px;
    justify-content:center;
  }
  .cat{
    padding:7px 15px; border-radius:99px; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    font-size:13px; font-family:inherit;
    transition:all .18s var(--ease); user-select:none;
  }
  .cat:hover{color:var(--text); border-color:var(--accent)}
  .cat.active{
    background:var(--accent); border-color:var(--accent);
    color:#fff; font-weight:600;
    box-shadow:0 4px 14px var(--accent-soft);
  }
  .cat .num{opacity:.65; font-size:11px; margin-left:4px}

  /* ============ 网格 ============ */
  .grid{
    display:grid; gap:13px;
    grid-template-columns:repeat(auto-fill, minmax(212px,1fr));
  }
  .card{
    position:relative; display:flex; align-items:center; gap:12px;
    padding:14px; border-radius:var(--r);
    background:var(--panel); border:1px solid var(--line);
    cursor:pointer; transition:all .2s var(--ease);
    animation:fadeUp .32s var(--ease) both;
    min-width:0;
  }
  @keyframes fadeUp{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  .card:hover{
    transform:translateY(-3px);
    border-color:var(--accent);
    background:var(--panel-hover);
    box-shadow:var(--shadow);
  }
  .card:active{transform:translateY(-1px)}

  .card .ico{
    width:44px; height:44px; flex:0 0 auto; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:17px;
    letter-spacing:-.5px;
    overflow:hidden; text-align:center; line-height:1;
  }
  .card .ico.len2{font-size:14px; letter-spacing:0}
  .card .ico.len3{font-size:11px; letter-spacing:0}
  .card .ico.len4{font-size:9px;  letter-spacing:0}

  .card .meta{min-width:0; flex:1 1 auto}
  .card .name{
    font-size:14px; font-weight:600; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .card .desc{
    font-size:12px; color:var(--muted); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; margin-top:1px;
  }

  .empty{
    grid-column:1/-1; text-align:center; color:var(--muted);
    padding:60px 20px; font-size:13px;
  }

  @media (max-width:640px){
    .app{padding:18px 14px 60px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
    .card{padding:12px; gap:10px}
    .card .ico{width:38px;height:38px;border-radius:10px;font-size:15px}
    .card .ico.len2{font-size:12px}
    .card .ico.len3{font-size:10px}
    .card .ico.len4{font-size:8px}
    .brand .title{font-size:14px}
    .logo{width:38px;height:38px}
    .icon-btn{padding:0 11px; font-size:12px}
    .go-btn{width:52px}
    #weather{padding:0 9px; font-size:12px}
    #weather .w-desc{display:none}
    #weather .w-city{max-width:64px; padding-left:5px}
  }
</style>
</head>
<body>

<div class="app">

  <!-- 顶栏 -->
  <header class="header">
    <div class="brand">
      <div class="logo">龙</div>
      <div>
        <div class="title">龙的导航</div>
        <div class="time" id="clock">--:--:--</div>
      </div>
    </div>
    <div class="header-actions">
      <span id="weather" title="点击刷新"><span class="w-loading">加载中…</span></span>
      <button class="icon-btn" id="btnTheme" title="切换主题">🌙 主题</button>
    </div>
  </header>

  <!-- 搜索 -->
  <div class="search-wrap">
    <div class="search-box">
      <button class="engine-btn" id="engineBtn">
        <span id="engineName">百度</span>
        <svg width="9" height="9" viewBox="0 0 10 10" fill="none">
          <path d="M1 3l4 4 4-4" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <input id="searchInput" placeholder="搜索，或直接输入网址…" autocomplete="off" spellcheck="false">
      <button class="go-btn" id="goBtn">搜索</button>
    </div>
    <ul class="suggest-box" id="suggestBox"></ul>
    <div class="engine-menu" id="engineMenu"></div>
  </div>

  <!-- 分类 -->
  <nav class="cats" id="cats"></nav>

  <!-- 卡片网格 -->
  <main class="grid" id="grid"></main>
</div>

<script>
(function(){
  'use strict';

  const $ = id => document.getElementById(id);

  /* ================= 书签数据（想改内容直接改这里） =================
     ico : 自定义图标文字。填了就用手写的，不填则自动取域名首字母。
          支持 1~4 个字符（中英文都行），字数越多图标里的字自动越小。
  ================================================================= */
  const BOOKMARKS = [
    {name:'JIZURA', ico:'JZ', url:'./src/JIZURA_歌词动态视频制作工具.html', desc:'歌词动态视频制作工具.html', cat:'常用'},
    {name:'Google', ico:'G',  url:'https://www.google.com',  desc:'全球搜索引擎', cat:'常用'},
    {name:'必应',   ico:'必', url:'https://www.bing.com',    desc:'微软搜索',     cat:'常用'},
    {name:'知乎',   ico:'知', url:'https://www.zhihu.com',   desc:'问答社区',     cat:'常用'},
    {name:'微博',   ico:'微', url:'https://weibo.com',       desc:'社交媒体',     cat:'常用'},
  ];

  /* ================= 搜索引擎 ================= */
  const ENGINES = [
    {name:'百度',   url:'https://www.baidu.com/s?wd='},
    {name:'Google', url:'https://www.google.com/search?q='},
    {name:'必应',   url:'https://www.bing.com/search?q='},
    {name:'知乎',   url:'https://www.zhihu.com/search?q='},
    {name:'GitHub', url:'https://github.com/search?q='},
    {name:'B站',    url:'https://search.bilibili.com/all?keyword='}
  ];

  /* ================= 天气位置（写死，想改城市改这里） =================
     name : 显示在天气后面的城市名，留空字符串 '' 则不显示
     lat  : 纬度
     lon  : 经度
     （经纬度可以百度搜索“XX市 经纬度”查到）
  ==================================================================== */
  const WEATHER_LOCATION = {
    name: '晋城',
    lat: 35.4664,
    lon: 112.8367
  };

  const state = {
    filter: '全部',
    engine: 0
  };

  /* ================= 工具 ================= */
  function hostOf(url){
    try { return new URL(url).hostname.replace(/^www\./, ''); }
    catch(e){ return url; }
  }

  function iconTextOf(bm){
    const custom = (bm.ico == null ? '' : String(bm.ico)).trim();
    if (custom) return custom.slice(0, 4);
    const c = (hostOf(bm.url) || bm.name || '?').trim().charAt(0);
    return c ? c.toUpperCase() : '?';
  }

  function hueOf(str){
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
    return h;
  }

  function iconStyle(bm){
    const hue = hueOf(hostOf(bm.url) + bm.name);
    return 'background:linear-gradient(135deg,hsl(' + hue + ',68%,56%),hsl(' +
           ((hue + 38) % 360) + ',66%,46%))';
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function normalizeUrl(u){
    u = String(u || '').trim();
    if (!u) return '';
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  }

  function looksLikeUrl(str){
    const s = str.trim();
    if (!s || /\s/.test(s)) return false;
    if (/^https?:\/\//i.test(s)) return true;
    return /^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(s);
  }

  /* ================= 主题 ================= */
  function setTheme(t, save){
    document.documentElement.setAttribute('data-theme', t);
    $('btnTheme').textContent = (t === 'dark' ? '🌙' : '☀️') + ' 主题';
    if (save !== false) localStorage.setItem('nav.theme', t);
  }

  function currentTheme(){
    return document.documentElement.getAttribute('data-theme') || 'dark';
  }

  /* ================= 时钟 ================= */
  function tickClock(){
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    $('clock').textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  /* ================= 分类 ================= */
  function categoryList(){
    const set = [];
    BOOKMARKS.forEach(b => {
      const c = (b.cat || '未分类').trim();
      if (set.indexOf(c) < 0) set.push(c);
    });
    return set;
  }

  function renderCats(){
    const box = $('cats');
    const cats = categoryList();
    const items = ['全部'].concat(cats);

    if (items.indexOf(state.filter) < 0) state.filter = '全部';

    const total = BOOKMARKS.length;

    box.innerHTML = items.map(function(c){
      const n = c === '全部'
        ? total
        : BOOKMARKS.filter(b => (b.cat || '未分类') === c).length;
      const active = state.filter === c ? ' active' : '';
      return '<div class="cat' + active + '" data-cat="' + escapeHtml(c) + '">' +
             escapeHtml(c) + '<span class="num">' + n + '</span></div>';
    }).join('');

    Array.prototype.forEach.call(box.querySelectorAll('.cat'), function(el){
      el.addEventListener('click', function(){
        state.filter = el.dataset.cat;
        renderCats();
        renderGrid();
      });
    });
  }

  /* ================= 网格 ================= */
  function renderGrid(){
    const grid = $('grid');
    const list = state.filter === '全部'
      ? BOOKMARKS
      : BOOKMARKS.filter(b => (b.cat || '未分类') === state.filter);

    let html = list.map(function(b, i){
      const desc = b.desc || hostOf(b.url);
      const txt  = iconTextOf(b);
      const len  = txt.length;
      const lenCls = len >= 4 ? ' len4' : (len === 3 ? ' len3' : (len === 2 ? ' len2' : ''));

      return '' +
      '<div class="card" data-url="' + escapeHtml(b.url) + '" style="animation-delay:' +
        Math.min(i * 18, 260) + 'ms">' +
        '<div class="ico' + lenCls + '" style="' + iconStyle(b) + '">' +
          escapeHtml(txt) +
        '</div>' +
        '<div class="meta">' +
          '<div class="name">' + escapeHtml(b.name) + '</div>' +
          '<div class="desc">' + escapeHtml(desc) + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    if (!list.length){
      html = '<div class="empty">这里还没有书签</div>';
    }

    grid.innerHTML = html;

    Array.prototype.forEach.call(grid.querySelectorAll('.card'), function(card){
      card.addEventListener('click', function(){
        window.open(card.dataset.url, '_blank', 'noopener');
      });
    });
  }

  /* ================= 搜索建议（百度 JSONP） ================= */
  let suggestTimer = null;
  let suggestList = [];
  let suggestIndex = -1;

  function fetchSuggestions(keyword){
    if (suggestTimer) clearTimeout(suggestTimer);

    const kw = keyword.trim();
    if (!kw){ hideSuggestBox(); return; }

    suggestTimer = setTimeout(function(){
      const old = document.getElementById('sugScript');
      if (old) old.remove();

      const cbName = '__bd_sug_' + Date.now();
      let done = false;

      window[cbName] = function(data){
        done = true;
        const s = document.getElementById('sugScript');
        if (s) s.remove();
        try { delete window[cbName]; } catch(e){ window[cbName] = undefined; }

        if (data && Object.prototype.toString.call(data.s) === '[object Array]'){
          suggestList = data.s.slice(0, 8);
          renderSuggestBox(suggestList, kw);
        } else {
          hideSuggestBox();
        }
      };

      const script = document.createElement('script');
      script.id = 'sugScript';
      script.src = 'https://suggestion.baidu.com/su?wd=' + encodeURIComponent(kw) +
                   '&cb=' + cbName + '&p=3&json=1&_t=' + Date.now();
      script.onerror = function(){
        if (done) return;
        script.remove();
        try { delete window[cbName]; } catch(e){ window[cbName] = undefined; }
        hideSuggestBox();
      };
      document.head.appendChild(script);
    }, 200);
  }

  function renderSuggestBox(list, keyword){
    const box = $('suggestBox');
    if (!list.length){ hideSuggestBox(); return; }

    suggestIndex = -1;

    const safeKw = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(' + safeKw + ')', 'gi');

    box.innerHTML = list.map(function(item, i){
      const hl = escapeHtml(item).replace(re, '<b>$1</b>');
      return '<li data-i="' + i + '">' + hl + '</li>';
    }).join('');

    box.classList.add('show');

    Array.prototype.forEach.call(box.querySelectorAll('li'), function(li){
      li.addEventListener('mousedown', function(e){
        e.preventDefault();
        $('searchInput').value = suggestList[parseInt(li.dataset.i, 10)];
        hideSuggestBox();
        $('searchInput').focus();
      });
      li.addEventListener('mouseenter', function(){
        suggestIndex = parseInt(li.dataset.i, 10);
        updateActiveItem();
      });
    });
  }

  function updateActiveItem(){
    const items = $('suggestBox').querySelectorAll('li');
    Array.prototype.forEach.call(items, function(li, i){
      li.classList.toggle('active', i === suggestIndex);
    });
    if (suggestIndex >= 0 && items[suggestIndex]){
      items[suggestIndex].scrollIntoView({ block:'nearest' });
    }
  }

  function hideSuggestBox(){
    $('suggestBox').classList.remove('show');
    suggestIndex = -1;
  }

  /* ================= 搜索 ================= */
  function renderEngineMenu(){
    const menu = $('engineMenu');
    menu.innerHTML = ENGINES.map(function(e, i){
      return '<button data-i="' + i + '"' +
             (i === state.engine ? ' class="active"' : '') + '>' +
             escapeHtml(e.name) + '</button>';
    }).join('');

    Array.prototype.forEach.call(menu.querySelectorAll('button'), function(btn){
      btn.addEventListener('click', function(){
        state.engine = parseInt(btn.dataset.i, 10);
        localStorage.setItem('nav.engine', state.engine);
        $('engineName').textContent = ENGINES[state.engine].name;
        renderEngineMenu();
        menu.classList.remove('show');
        $('searchInput').focus();
      });
    });
  }

  function doSearch(){
    const raw = $('searchInput').value.trim();
    if (!raw) { $('searchInput').focus(); return; }

    hideSuggestBox();

    if (looksLikeUrl(raw)){
      window.open(normalizeUrl(raw), '_blank', 'noopener');
    } else {
      window.open(ENGINES[state.engine].url + encodeURIComponent(raw), '_blank', 'noopener');
    }
  }

  /* ================= 天气（写死位置 + Open-Meteo） ================= */
  const WMO = {
    0:  ['☀️', '晴'],
    1:  ['🌤️', '晴间多云'],
    2:  ['⛅', '多云'],
    3:  ['☁️', '阴'],
    45: ['🌫️', '雾'],
    48: ['🌫️', '冻雾'],
    51: ['🌦️', '小毛毛雨'],
    53: ['🌦️', '毛毛雨'],
    55: ['🌧️', '大毛毛雨'],
    56: ['🌧️', '冻毛毛雨'],
    57: ['🌧️', '强冻毛毛雨'],
    61: ['🌧️', '小雨'],
    63: ['🌧️', '中雨'],
    65: ['🌧️', '大雨'],
    66: ['🌧️', '冻雨'],
    67: ['🌧️', '强冻雨'],
    71: ['🌨️', '小雪'],
    73: ['🌨️', '中雪'],
    75: ['❄️', '大雪'],
    77: ['🌨️', '雪粒'],
    80: ['🌦️', '阵雨'],
    81: ['🌧️', '中阵雨'],
    82: ['⛈️', '大阵雨'],
    85: ['🌨️', '阵雪'],
    86: ['❄️', '大阵雪'],
    95: ['⛈️', '雷阵雨'],
    96: ['⛈️', '雷阵雨伴冰雹'],
    99: ['⛈️', '强雷暴伴冰雹']
  };

  function wmoInfo(code){
    return WMO[code] || ['🌡️', '未知'];
  }

  function weatherLoading(txt){
    $('weather').innerHTML = '<span class="w-loading">' + txt + '</span>';
  }

  /* 直接使用写死的位置请求天气 */
  function initWeather(){
    weatherLoading('加载中…');
    fetchWeather(WEATHER_LOCATION.lat, WEATHER_LOCATION.lon, WEATHER_LOCATION.name);
  }

  function fetchWeather(lat, lon, city){
    const url = 'https://api.open-meteo.com/v1/forecast' +
      '?latitude=' + Number(lat).toFixed(4) +
      '&longitude=' + Number(lon).toFixed(4) +
      '&current=temperature_2m,weather_code,apparent_temperature,relative_humidity_2m,wind_speed_10m' +
      '&timezone=auto';

    fetch(url)
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data && data.current) renderWeather(data.current, city);
        else weatherLoading('获取失败');
      })
      .catch(function(){ weatherLoading('获取失败'); });
  }

  function renderWeather(cur, city){
    const info  = wmoInfo(cur.weather_code);
    const temp  = Math.round(cur.temperature_2m);
    const feels = Math.round(cur.apparent_temperature);
    const humid = cur.relative_humidity_2m;
    const wind  = cur.wind_speed_10m;

    let html = '<span class="w-emoji">' + info[0] + '</span>' +
               '<span class="w-temp">' + temp + '°C</span>' +
               '<span class="w-desc">' + info[1] + '</span>';

    if (city){
      html += '<span class="w-city">' + escapeHtml(city) + '</span>';
    }

    const el = $('weather');
    el.innerHTML = html;
    el.title = (city ? city + ' · ' : '') +
               '体感 ' + feels + '°C · 湿度 ' + humid + '% · 风速 ' + wind + ' km/h · 点击刷新';
  }

  /* ================= 事件绑定 ================= */
  function bind(){
    $('btnTheme').addEventListener('click', function(){
      setTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
    });

    // 天气：点击刷新
    $('weather').addEventListener('click', initWeather);

    // 搜索框：输入触发建议
    const input = $('searchInput');
    input.addEventListener('input', function(){
      fetchSuggestions(this.value);
    });

    input.addEventListener('keydown', function(e){
      const box = $('suggestBox');
      const items = box.querySelectorAll('li');

      if (e.key === 'ArrowDown' && items.length){
        e.preventDefault();
        suggestIndex = (suggestIndex + 1) % items.length;
        updateActiveItem();
        return;
      }
      if (e.key === 'ArrowUp' && items.length){
        e.preventDefault();
        suggestIndex = (suggestIndex - 1 + items.length) % items.length;
        updateActiveItem();
        return;
      }
      if (e.key === 'Enter'){
        e.preventDefault();
        if (suggestIndex >= 0 && items.length && suggestList[suggestIndex]){
          this.value = suggestList[suggestIndex];
          hideSuggestBox();
        }
        doSearch();
        return;
      }
      if (e.key === 'Escape'){
        if (box.classList.contains('show')){ hideSuggestBox(); }
        else { this.value = ''; }
      }
    });

    input.addEventListener('blur', function(){
      setTimeout(hideSuggestBox, 120);
    });

    $('goBtn').addEventListener('click', doSearch);

    $('engineBtn').addEventListener('click', function(e){
      e.stopPropagation();
      hideSuggestBox();
      $('engineMenu').classList.toggle('show');
    });

    document.addEventListener('click', function(e){
      if (!e.target.closest('.search-wrap')){
        $('engineMenu').classList.remove('show');
        hideSuggestBox();
      }
    });

    // 快捷键：/ 聚焦搜索
    document.addEventListener('keydown', function(e){
      const tag = (e.target.tagName || '').toLowerCase();
      const typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
      if (typing) return;
      if (e.key === '/'){
        e.preventDefault();
        $('searchInput').focus();
      }
    });
  }

  /* ================= 启动 ================= */
  function init(){
    const t = localStorage.getItem('nav.theme');
    setTheme(t === 'light' ? 'light' : 'dark', false);

    const e = parseInt(localStorage.getItem('nav.engine'), 10);
    if (e >= 0 && e < ENGINES.length) state.engine = e;
    $('engineName').textContent = ENGINES[state.engine].name;

    renderEngineMenu();
    renderCats();
    renderGrid();
    bind();
    tickClock();
    setInterval(tickClock, 1000);

    // 天气：首次 + 每 10 分钟刷新
    initWeather();
    setInterval(initWeather, 600000);
  }

  init();
})();
</script>
